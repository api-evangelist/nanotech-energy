aid: nanotech-energy
name: Nanotech Energy
description: 'Nanotech Energy is an advanced materials manufacturer that develops and
  produces graphene-based super materials and the energy-storage products built from
  them. Its catalog spans graphene powders, graphene oxide pastes, dispersions, conductive
  inks and conductive adhesives, silver nanowires, and non-flammable lithium-ion battery
  cells and packs aimed at home and grid energy storage, marine, household and electric-vehicle
  applications. The company also offers customer-facing testing, analysis and product
  development services to help customers scale a graphene formulation from concept
  to full production. It is a physical-goods manufacturer: it publishes a marketing
  and product website but no developer program, public API, SDK or machine-readable
  specification of any kind.'
